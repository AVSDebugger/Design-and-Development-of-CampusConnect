
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Campus Connect</title>
    <link rel="stylesheet" href="../assets/css/alumni.css">
<body>

    <div class="profile-container">

        <div class="profile-header">
            <h1>My Alumni Profile</h1>
            <p>View your personal and professional information</p>
        </div>

        <div class="profile-card">

            <h2>Personal Information</h2>

            <div class="profile-details">
                <div>
                    <label>Full Name</label>
                    <p>John Smith</p>
                </div>

                <div>
                    <label>Email Address</label>
                    <p>john@example.com</p>
                </div>

                <div>
                    <label>Phone Number</label>
                    <p>9876543210</p>
                </div>

                <div>
                    <label>Graduation Year</label>
                    <p>2024</p>
                </div>

                <div>
                    <label>Course</label>
                    <p>Bachelor of Computer Applications</p>
                </div>
            </div>

            <h2>Professional Information</h2>

            <div class="profile-details">
                <div>
                    <label>Current Company</label>
                    <p>ABC Technologies</p>
                </div>

                <div>
                    <label>Designation</label>
                    <p>Software Developer</p>
                </div>

                <div>
                    <label>Skills</label>
                    <p>Python, Java, SQL, HTML, CSS</p>
                </div>
            </div>

            <a href="edit-profile.html" class="back-button">Edit Profile</a>
            <a href="dashboard.html" class="back-button">Back to Dashboard</a>

        </div>
    </div>

</body>
</html>
