
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - Campus Connect</title>
    <link rel="stylesheet" href="../assets/css/alumni.css">
</head>
<body>

    <div class="profile-container">

        <div class="profile-header">
            <h1>Edit Alumni Profile</h1>
            <p>Update your personal and professional information</p>
        </div>

        <form class="profile-card">

            <h2>Personal Information</h2>

            <label>Full Name</label>
            <input type="text" name="name" placeholder="Enter full name" required>

            <label>Email Address</label>
            <input type="email" name="email" placeholder="Enter email address" required>

            <label>Phone Number</label>
            <input type="tel" name="phone" placeholder="Enter phone number" required>

            <label>Graduation Year</label>
            <input type="number" name="graduation_year" placeholder="Enter graduation year" required>

            <label>Course</label>
            <input type="text" name="course" placeholder="Enter your course" required>

            <h2>Professional Information</h2>

            <label>Current Company</label>
            <input type="text" name="company" placeholder="Enter company name">

            <label>Designation</label>
            <input type="text" name="designation" placeholder="Enter designation">

            <label>Skills</label>
            <textarea name="skills" placeholder="Enter your skills"></textarea>

            <button type="submit">Save Changes</button>

            <a href="view-profile.html" class="back-button">Cancel</a>

        </form>

    </div>

</body>
</html>
