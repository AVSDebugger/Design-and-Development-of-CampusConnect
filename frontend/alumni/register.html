
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumni Registration - Campus Connect</title>
    <link rel="stylesheet" href="../assets/css/alumni.css">
</head>
<body>

    <div class="register-container">

        <div class="register-header">
            <h1>Campus Connect</h1>
            <p>Join Our Alumni Network</p>
        </div>

        <form class="register-form">

            <h2>Alumni Registration</h2>
            <p>Create your account to connect with your college</p>

            <label>Full Name</label>
            <input type="text" name="name" placeholder="Enter your full name" required>

            <label>Email Address</label>
            <input type="email" name="email" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" name="password" placeholder="Create password" required>

            <label>Phone Number</label>
            <input type="tel" name="phone" placeholder="Enter phone number" required>

            <label>Graduation Year</label>
            <input type="number" name="graduation_year" placeholder="e.g. 2024" required>

            <label>Course</label>
            <input type="text" name="course" placeholder="Enter your course" required>

            <label>Current Company</label>
            <input type="text" name="company" placeholder="Enter company name">

            <label>Designation</label>
            <input type="text" name="designation" placeholder="Enter your designation">

            <button type="submit">Register</button>

            <p class="login-link">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </form>
    </div>

</body>
</html>
